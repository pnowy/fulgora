name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  generate-latest-changelog:
    name: Generate latest changelog
    runs-on: ubuntu-24.04
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate latest changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --github-repo ${{ github.repository }}
  generate-full-changelog:
    name: Generate full changelog
    runs-on: ubuntu-24.04
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate full changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Show CHANGELOG.md
        run: cat CHANGELOG.md

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    needs: [ generate-latest-changelog, generate-full-changelog ]
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Update package.json version
        run: npm version --no-git-tag-version --allow-same-version "${RELEASE_VERSION#v}"
      # Publishing runs before the release commit and skips existing versions, so a failed run can simply be re-run.
      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          skipDuplicate: true
      - name: Publish to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          skipDuplicate: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ needs.generate-latest-changelog.outputs.release_body }}
          name: "Release ${{ github.ref_name }} 🐾"
      - name: Commit CHANGELOG.md and version to main
        env:
          CHANGELOG: ${{ needs.generate-full-changelog.outputs.release_body }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github.actions@users.noreply.github.com"
          git fetch --no-tags origin main
          git switch --discard-changes -C release-commit FETCH_HEAD
          npm version --no-git-tag-version --allow-same-version "${RELEASE_VERSION#v}"
          printf '%s\n' "$CHANGELOG" > CHANGELOG.md
          git add CHANGELOG.md package.json package-lock.json
          if git diff --cached --quiet; then
            echo "main is already up to date"
            exit 0
          fi
          git commit -m "chore(release): update CHANGELOG.md for ${RELEASE_VERSION} [skip ci]"
          git push origin HEAD:main
